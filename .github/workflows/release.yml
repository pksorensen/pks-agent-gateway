name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write   # required so the coolify-deploy runner can fetch a GH OIDC token

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build once with buildx and publish to the canonical Agentics registry.
  # Runs on the self-hosted runner so the registry-login action can reach the
  # pks credential socket.
  build-push:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, devcontainer-runner]
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.agentics.dk
        uses: pksorensen/pks-cli/.github/actions/registry-login@main
        with:
          registry: registry.agentics.dk

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.agentics.dk/agentics/pks-agent-gateway:${{ env.VERSION }}
            registry.agentics.dk/agentics/pks-agent-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log out of registry.agentics.dk
        if: always()
        run: docker logout registry.agentics.dk

  # Cross-compile gateway-cli for all platforms and attach to the GitHub Release.
  build-cli:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/cli/go.mod
          cache-dependency-path: src/cli/go.sum

      - name: Build gateway-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd src/cli
          go build -ldflags="-s -w -X main.version=${{ env.VERSION }}" \
            -o ../../dist/gateway-cli_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext || '' }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-cli_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/gateway-cli_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext || '' }}

  # Collect CLI binaries and attach them to the release created by release-please.
  release-assets:
    needs: [release-please, build-cli]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum gateway-cli_* > gateway-cli_${{ env.VERSION }}_checksums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/gateway-cli_*
